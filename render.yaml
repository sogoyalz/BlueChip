# Full-stack portfolio demo on one strictly Free Render web service.
# No database resource or paid worker is provisioned by this blueprint.
# Free services sleep when idle; reconciliation resumes after waking.
services:
  - type: web
    name: bluechip
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /backend/readyz
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: lax
      - key: RUN_MIGRATIONS
        value: "false"
      - key: MONGO_URL
        sync: false
      - key: TOKEN_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_SECRET
        sync: false
      - key: OPERATOR_USER_IDS
        sync: false
