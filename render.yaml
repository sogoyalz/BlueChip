# Render Blueprint — deploys the backend as a free web service.
# One-time setup: dashboard.render.com → New → Blueprint → select this repo.
# You'll be prompted for the sync:false env vars:
#   MONGO_URL          — the MongoDB Atlas connection string
#   CORS_ORIGINS       — comma-separated Netlify URLs of the two frontends
#   GEMINI_API_KEY      — Gemini SANDBOX trading API key (exchange.sandbox.gemini.com)
#   GEMINI_API_SECRET   — Gemini SANDBOX trading API secret
#
# IMPORTANT — auth cookie/domain requirement. The auth cookie defaults to
# sameSite:"lax", which is only sent on same-site requests. If the backend and
# the two Netlify frontends sit on unrelated domains (the platform defaults,
# *.onrender.com and *.netlify.app), the browser will NOT send it and login
# fails silently — 401s on every authenticated request, not a crash, and
# nothing in any log to explain it. Pick one before going live:
#   (a) Put all three services on one registrable domain via custom domains
#       (api.yoursite.com, app.yoursite.com, www.yoursite.com) and leave
#       COOKIE_SAMESITE unset. This is the safer option: the cookie stays
#       first-party and "lax" blocks the cross-site vectors "none" allows.
#   (b) Keep the platform domains and set COOKIE_SAMESITE=none below. Requires
#       NODE_ENV=production, which is what sets Secure — the backend refuses to
#       boot on that combination rather than let the browser drop the cookie.
#
# IMPORTANT — this service must run as EXACTLY ONE instance. Four pieces of
# state live in process memory, and a second instance breaks each one quietly,
# with no error to tell you:
#   backend/services/geminiPrivate.ts — the Gemini nonce counter. Two processes
#     signing with the same API key interleave nonces and Gemini starts
#     rejecting signed requests, which surfaces as failing orders.
#   backend/middlewares/rateLimit.ts  — an in-memory store, so every limit
#     multiplies by the instance count.
#   backend/services/priceFeed.ts     — the price cache, so clients see
#     different prices depending on which instance they reach.
#   backend/services/sse.ts           — the SSE client registry and the per-IP
#     socket cap, which is then enforced per instance rather than overall.
# Scaling up is therefore not a configuration change. The nonce is the piece
# that has to move first — to Redis INCR, or to a single-writer process.

services:
  - type: web
    name: bluechip-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: TOKEN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_SECRET
        sync: false
      # Leave unset for option (a) above. Set to "none" for option (b).
      - key: COOKIE_SAMESITE
        sync: false
      # Where orphaned-fill alerts go — any endpoint that accepts a JSON POST.
      # Unset is supported (alerts stay on stdout) but the backend warns at
      # boot in production, because that alert has no other reader.
      - key: MONITORING_WEBHOOK_URL
        sync: false
