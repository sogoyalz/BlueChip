services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    env_file: ../backend/.env
    environment:
      NODE_ENV: production
      PORT: "3002"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the final HTTPS origin}
      RUN_MIGRATIONS: "false"
    restart: unless-stopped
    init: true
    expose: ["3002"]
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the final hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
