name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: jsdom (via Vitest) calls webidl.util.markAsUncloneable, which
          # only exists from Node 22. On 20 every frontend test file failed to
          # start its worker. Node 20 also ships npm 10, which rejects lockfiles
          # npm 11 writes.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The persistence integration tests run a real mongod via
      # mongodb-memory-server. Its binary is downloaded on first use, and a
      # fresh `npm ci` would otherwise re-download it on every single run.
      # An absolute path on both sides: `env:` values are not shell-expanded,
      # so a leading ~ would be passed through literally and the cache missed.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: jsdom (via Vitest) calls webidl.util.markAsUncloneable, which
          # only exists from Node 22. On 20 every frontend test file failed to
          # start its worker. Node 20 also ships npm 10, which rejects lockfiles
          # npm 11 writes.
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: jsdom (via Vitest) calls webidl.util.markAsUncloneable, which
          # only exists from Node 22. On 20 every frontend test file failed to
          # start its worker. Node 20 also ships npm 10, which rejects lockfiles
          # npm 11 writes.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build

  e2e:
    # The browser journey needs the backend compiled and both React apps
    # buildable, so it runs after the three unit jobs rather than beside them.
    needs: [backend, dashboard, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: jsdom (via Vitest) calls webidl.util.markAsUncloneable, which
          # only exists from Node 22. On 20 every frontend test file failed to
          # start its worker. Node 20 also ships npm 10, which rejects lockfiles
          # npm 11 writes.
          node-version: 22
      # Same reasoning as the backend job: the suite boots a real mongod.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix dashboard
          npm ci --prefix frontend
          npm ci --prefix e2e
      # The suite runs the compiled backend, not ts-node.
      - name: Build backend
        run: npm run build --prefix backend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
